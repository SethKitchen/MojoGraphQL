[packages.gql_scorchql]
summary = "ScorchQL: a federated gateway with a subgraph registry, hot reload, subscriptions, @defer and a web explorer"
depends = ["gql_language", "gql_json", "gql_http", "gql_composition", "gql_router", "gql_router_stream", "gql_ws"]
