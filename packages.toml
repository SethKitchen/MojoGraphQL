#
# The package graph. Every top-level Mojo package is listed here with the
# packages it imports. `make packages-check` refuses an import of a package
# that is not listed, a cycle, and a package directory that is not listed.
# A user can build and install one package and only its dependencies:
#
#     make package PKG=gql_language
#
# `upstream` names the MIT sources each package ports, at the pinned
# version. THIRD-PARTY-NOTICES.md holds their license texts.
#
# `test_depends` lists the packages that only the tests and the benchmarks
# of a package can also import. A library module cannot import them.

[packages.gql_language]
summary = "Source, lexer, parser, AST, printer and visitor"
depends = []
upstream = ["graphql-js 16.14.2 src/language and the AST utilities of src/utilities (MIT)"]

[packages.gql_json]
summary = "JSON values, a fast parser and a serializer, for variables and responses"
depends = []
upstream = ["RFC 8259; serialization as ECMAScript JSON.stringify, which graphql-js responses use"]

[packages.gql_http]
summary = "HTTP/1.1 server and client over POSIX sockets"
depends = []
upstream = ["RFC 9110 and RFC 9112; the GraphQL over HTTP specification"]

[packages.gql_http2]
summary = "HTTP/2 (RFC 9113) and HPACK (RFC 7541) server and client: h2c, the h2c upgrade and a Transport for TLS"
depends = ["gql_http"]
test_depends = ["gql_json"]
upstream = ["h2 v0.4.20 (b0e8908) src/hpack, src/frame, src/proto, src/server.rs, src/client.rs, and the tests of tests/h2-tests and src/hpack/test (MIT); RFC 9113, RFC 7541 and RFC 7540 section 3.2"]

[packages.gql_tls]
summary = "TLS 1.3 and ALPN through the system OpenSSL, loaded at run time; HTTPS/1.1 server and client"
depends = ["gql_http"]
upstream = ["RFC 8446 and RFC 7301; OpenSSL 3 (Apache-2.0) is loaded with dlopen at run time, and no OpenSSL code is ported"]

[packages.gql_http3]
summary = "HTTP/3 and QPACK over QUIC from the system OpenSSL; Alt-Svc and the client fallback chain"
depends = ["gql_http", "gql_tls"]
upstream = ["hyperium/h3 h3-v0.0.8 (22c1aa3) h3/src/qpack and h3/src/proto (MIT); RFC 9114, RFC 9204, RFC 9000 section 16 and RFC 7838; the QUIC API of OpenSSL 3.5 (Apache-2.0) is loaded with dlopen at run time, and no OpenSSL code is ported"]

[packages.gql_schema]
summary = "Type system: build a schema from SDL, extend, print and validate it"
depends = ["gql_language", "gql_json"]
upstream = ["graphql-js 16.14.2 src/type and src/utilities (MIT)"]

[packages.gql_validation]
summary = "Validation of executable documents against a schema: TypeInfo and every specified rule"
depends = ["gql_language", "gql_schema"]
upstream = ["graphql-js 16.14.2 src/validation and src/utilities/TypeInfo.ts (MIT)"]

[packages.gql_execution]
summary = "Execution of operations with resolvers, and introspection"
depends = ["gql_language", "gql_schema", "gql_json"]
upstream = ["graphql-js 16.14.2 src/execution, src/type/introspection.ts and the introspection utilities of src/utilities (MIT)"]

[packages.gql_client]
summary = "Normalized client cache: InMemoryCache, type and field policies"
depends = ["gql_language", "gql_json"]
upstream = ["Apollo Client 4.3.3 (ae0dfce) src/cache/inmemory: inMemoryCache.ts, entityStore.ts, writeToStore.ts, readFromStore.ts, policies.ts, helpers.ts, key-extractor.ts; src/cache/core/cache.ts; the src/utilities helpers they use (MIT)"]

[packages.gql_composition]
summary = "Apollo Federation composition: validation of subgraphs"
depends = ["gql_language"]
upstream = ["Hive Federation Composition v0.27.0 6272ad8 (MIT); federation v2.10 to v2.15 checks from the public Apollo GraphOS page Federation versions"]

[packages.gql_mcp]
summary = "Model Context Protocol server: GraphQL operations as tools, introspect, search, execute and validate"
depends = ["gql_language", "gql_json", "gql_schema", "gql_validation", "gql_http"]
upstream = ["Apollo MCP Server 2.0.0 (04e4e6e) crates/apollo-mcp-server/src: operations/, schema_tree_shake.rs, introspection/, graphql.rs; crates/apollo-schema-index/src (MIT)"]

[packages.gql_subgraph]
summary = "Apollo Federation subgraphs: buildSubgraphSchema, printSubgraphSchema and entity resolution"
depends = ["gql_language", "gql_schema", "gql_execution", "gql_json"]
test_depends = ["gql_server"]
upstream = ["@apollo/subgraph 2.14.4 (b95c124) subgraph-js/src: buildSubgraphSchema.ts, printSubgraphSchema.ts, types.ts, schema-helper/buildSchemaFromSDL.ts (MIT); the Apollo Federation subgraph specification and federation/v2.x specifications; Hive Federation Composition v0.27.0 (MIT) as the reference for the federation-internals behavior"]

[packages.gql_router]
summary = "Hive Router: the query planner, operation cache, authorization and null bubbling"
depends = ["gql_language", "gql_json", "gql_http"]
upstream = ["Hive Router 1a29df9 (MIT) bin/router/src/query_planner (ast, federation_spec, graph, planner, state, utils, and the tests with bin/router/fixture), cache_state.rs, config/cache.rs, http_utils/headers.rs, executor/headers/request.rs, executor/headers/response.rs, pipeline/authorization, executor/operation_filter.rs, executor/execution/error_masking.rs, executor/execution/operation_name.rs, executor/execution/rewrites.rs, executor/response/merge.rs, executor/response/graphql_error.rs, executor/response/storage.rs, executor/response/subgraph_response.rs, and executor/execution/plan.rs (`select_fetch_variables`, `condition_node_by_variables`, `execute_plan_node`, `prepare_batch_fetch_job_state`), executor/utils/traverse.rs, `partition_batch_errors_by_alias`, `collect_batched_entities_by_alias`, and `merge_batch_alias_entities`; query_planner/consumer_schema, tests/generated.rs and apollo-router-workspace are excluded"]

[packages.gql_server]
summary = "GraphQL server: the Apollo Server request pipeline, HTTP handling and a standalone server"
depends = ["gql_language", "gql_json", "gql_schema", "gql_validation", "gql_execution", "gql_http"]
upstream = ["Apollo Server 5.5.1 (0c22029) packages/server/src: ApolloServer.ts, requestPipeline.ts, runHttpQuery.ts, httpBatching.ts, preventCsrf.ts, errorNormalize.ts, internalErrorClasses.ts, errors/index.ts, cachePolicy.ts, utils/HeaderMap.ts, validationRules/NoIntrospection.ts, the header part of plugin/cacheControl, plugin/disableSuggestions, plugin/inlineTrace, plugin/traceTreeBuilder.ts, plugin/schemaIsSubgraph.ts, the inline trace part of plugin/disabled, standalone/index.ts, and the Trace message of packages/usage-reporting-protobuf/src/reports.proto (MIT); negotiator 1.1.0, content-type 2.1.0, whatwg-mimetype 4.0.0, cors 2.8.6, body-parser 2.3.0, finalhandler 2.1.1 and @apollo/utils.keyvaluecache 4.0.0, as Apollo Server uses them (MIT)"]

[packages.gql_codegen]
summary = "Code generation: Mojo models, documents and operation ids for GraphQL operations"
depends = ["gql_language", "gql_schema", "gql_validation", "gql_json"]
upstream = ["Apollo Kotlin afe947c (5.2.1-SNAPSHOT; the benchmark runs the published 5.2.0) libraries/apollo-compiler: ApolloCompiler.kt, Options.kt, Strings.kt, UsedCoordinates.kt, ir/IrOperationsBuilder.kt, ir/OperationBasedModelGroupBuilder.kt, ir/BooleanExpression.kt, ir/usedFragments.kt, internal/ApolloExecutableDocumentTransform.kt, internal/Inflector.kt, internal/checkCapitalizedFields.kt, internal/checkApolloInlineFragmentsHaveTypeCondition.kt, internal/DefaultApolloCompilerRegistry.kt (sha256); libraries/apollo-ast: SDLWriter.kt, gql.kt (writeInternal), gqlstrings.kt, QueryDocumentMinifier.kt, Schema.kt (type relations), Issue.kt (MIT)"]

[packages.gql_seamstress]
summary = "seamstress: the offline Apollo Rover commands supergraph compose, subgraph introspect and graph introspect"
depends = ["gql_language", "gql_json", "gql_schema", "gql_execution", "gql_http", "gql_composition"]
upstream = ["Apollo Rover 1.0.0 (39a041a) MIT parts: src/command/supergraph/compose, src/composition/supergraph/config (subgraph resolution), src/command/subgraph/introspect.rs, src/command/graph/introspect.rs, src/command/output.rs, src/options/output.rs, src/error, src/federation.rs, src/utils/parsers.rs, src/cli.rs; crates/rover-client/src/operations/subgraph/introspect and graph/introspect; crates/rover-graphql/src/lib.rs; apollo-federation-types 0.18.0-rc.1 src/config and src/rover (MIT); apollo-compiler 1.33.0 src/ast/serialize.rs and its built-in introspection types (MIT arm of MIT OR Apache-2.0). src/utils/expansion.rs (Elastic License 2.0) and the supergraph plugin are excluded"]
