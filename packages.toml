depends = ["gql_language", "gql_schema", "gql_json"]
upstream = ["graphql-go-tools v2 (9ef6e24, 2026-10-14) v2/pkg/astnormalization (the operation stages and passes), v2/pkg/astminify, the executable document part of v2/pkg/astprinter and v2/pkg/variablesvalidation, and their tests (MIT); sjson v1.0.4 and jsonparser JSON edits as upstream writes them"]

[packages.gql_stream]
summary = "Pull-based event streams for subscriptions: Poll, EventStream, Waker, an epoll EventLoop, PubSub, map and withFilter"
depends = ["gql_json"]
upstream = ["graphql-subscriptions 3.0.0 (d74107c) src/pubsub.ts, src/pubsub-engine.ts, src/pubsub-async-iterable-iterator.ts, src/with-filter.ts and src/test (MIT); graphql-js 16.14.2 src/execution/mapAsyncIterator.ts (MIT)"]

[packages.gql_execution]
summary = "Execution of operations with resolvers, subscriptions, @defer and @stream, and introspection"
depends = ["gql_language", "gql_schema", "gql_json", "gql_stream"]
upstream = ["graphql-js 16.14.2 src/execution (subscribe.ts included), src/type/introspection.ts and the introspection utilities of src/utilities (MIT)", "graphql-js 17.0.2 (71606d7) experimentalExecuteIncrementally: src/execution/collectFields.ts (@defer), getStreamUsage.ts, incremental/IncrementalExecutor.ts, IncrementalPublisher.ts, WorkQueue.ts and buildExecutionPlan.ts, the @defer and @stream definitions of src/type/directives.ts, and incremental/__tests__/defer-test.ts and stream-test.ts, with the abortSignal and enableEarlyExecution of ExecutionArgs (MIT)"]

[packages.gql_client]
summary = "Normalized client cache: InMemoryCache, type and field policies, incremental delivery and subscription writes"
depends = ["gql_language", "gql_json"]
upstream = ["Apollo Client 4.3.3 (ae0dfce) src/cache/inmemory: inMemoryCache.ts, entityStore.ts, writeToStore.ts, readFromStore.ts, policies.ts, helpers.ts, key-extractor.ts; src/cache/core/cache.ts; the src/utilities helpers they use (MIT)", "Apollo Client 4.3.3 (ae0dfce) src/incremental/handlers: graphql17Alpha9.ts, defer20220824.ts; src/utilities/internal: DeepMerger.ts, makeStreamInfoTrie.ts, StreamArrayState.ts, addDeferFragmentLabels.ts, hasDirectives.ts, isStreamField.ts; src/core/QueryInfo.ts: markQueryResult, markSubscriptionResult, shouldWriteResult; the result mapping of QueryManager.startGraphQLSubscription (MIT)"]

[packages.gql_client_http]
summary = "The response parsing of the Apollo Client HTTP link: multipart/mixed results and the JSON response check"
depends = ["gql_http", "gql_json"]
upstream = ["Apollo Client 4.3.3 (ae0dfce) src/link/http/parseAndCheckHttpResponse.ts (MIT)"]

[packages.gql_composition]
summary = "Apollo Federation composition: validation of subgraphs"
depends = ["gql_language"]
upstream = ["Hive Federation Composition v0.27.0 6272ad8 (MIT); federation v2.10 to v2.15 checks from the public Apollo GraphOS page Federation versions"]

[packages.gql_mcp]
summary = "Model Context Protocol server: GraphQL operations as tools, introspect, search, execute and validate"
depends = ["gql_language", "gql_json", "gql_schema", "gql_validation", "gql_http"]
upstream = ["Apollo MCP Server 2.0.0 (04e4e6e) crates/apollo-mcp-server/src: operations/, schema_tree_shake.rs, introspection/, graphql.rs; crates/apollo-schema-index/src (MIT)"]

[packages.gql_subgraph]
summary = "Apollo Federation subgraphs: buildSubgraphSchema, printSubgraphSchema and entity resolution"
depends = ["gql_language", "gql_schema", "gql_execution", "gql_json"]
test_depends = ["gql_server", "gql_stream"]
upstream = ["@apollo/subgraph 2.14.4 (b95c124) subgraph-js/src: buildSubgraphSchema.ts, printSubgraphSchema.ts, types.ts, schema-helper/buildSchemaFromSDL.ts (MIT); the Apollo Federation subgraph specification and federation/v2.x specifications; Hive Federation Composition v0.27.0 (MIT) as the reference for the federation-internals behavior"]

[packages.gql_router]
summary = "Hive Router: the query planner, the executor, the request pipeline and an HTTP server"
depends = ["gql_language", "gql_json", "gql_http", "gql_schema", "gql_validation"]
upstream = ["Hive Router 1a29df9 (MIT) bin/router/src/query_planner (ast, federation_spec, graph, planner, state, utils, consumer_schema, and the tests with bin/router/fixture), cache_state.rs, config/cache.rs, http_utils/headers.rs, http_utils/probes.rs, pipeline (mod.rs, parser.rs, validation/mod.rs, normalize.rs, coerce_variables.rs, query_plan.rs, execution.rs, error.rs, execution_request.rs, header.rs, authorization), executor (execution, projection, variables, response, utils/traverse.rs, introspection, executors/http.rs, operation_filter.rs, and their tests), and lib/graphql-tools src/validation (the default rule list, the error codes, messages and locations); tests/generated.rs, the executor plugins, extensions, header propagation, error masking, operation name forwarding and apollo-router-workspace are excluded; gql_router_stream has the subscription transports"]

