query Repository01($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) { id name description stargazers { totalCount } }
}

query User01($login: String!) {
  user(login: $login) { id login name bio company location }
}

query OrganizationRepositories01($login: String!, $first: Int = 10) {
  organization(login: $login) { name repositories(first: $first) { totalCount nodes { name } } }
}

query Issues01($owner: String!, $name: String!, $states: [IssueState!], $first: Int = 20) {
  repository(owner: $owner, name: $name) {
    issues(states: $states, first: $first) { nodes { number title state author { login } } }
  }
}

query Search01($query: String!, $type: SearchType!, $first: Int) {
  search(query: $query, type: $type, first: $first) {
    issueCount
    nodes { ... on Repository { nameWithOwner } ... on Issue { title } }
  }
}

query License01($key: String!) {
  license(key: $key) { name spdxId body }
}

query RateLimit01 {
  rateLimit { limit remaining resetAt }
}

query Node01($id: ID!) {
  node(id: $id) { id ... on User { login } }
}

query Topic01($name: String!) {
  topic(name: $name) { name relatedTopics { name } }
}

query Viewer01 {
  viewer { login email repositories(first: 5) { nodes { name isPrivate } } }
}

