# The Rust TLS baseline. `hyper-rustls` runs a hyper 1 server and a hyper 1
# client over rustls (tokio-rustls), each on a tokio runtime with one
# thread of its own: the TLS stack of Hive Router. hyper, hyper-util,
# tokio and http-body-util are MIT; rustls, tokio-rustls and
# rustls-pki-types are MIT OR Apache-2.0 OR ISC, used under MIT.

[package]
name = "mojographql-bench-tls-rust"
version = "0.0.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-rustls = "0.26"
rustls = "0.23"

[[bin]]
name = "hyper-rustls"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
